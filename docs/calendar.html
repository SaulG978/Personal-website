<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar - Saul Garcia</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Custom -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Saul Garcia</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="hobbies.html">Hobbies</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
          <li class="nav-item"><a class="nav-link active" href="calendar.html">Calendar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="container py-4">
    <h1 class="mb-3">My Weekly Calendar</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#event_modal">
      + Add Event
    </button>
  </div>

  <!-- CALENDAR GRID -->
  <div class="container pb-5">
    <div class="row g-3">

      <div class="col-md-3"><h4>Sunday</h4><div id="sunday" class="day-col"></div></div>
      <div class="col-md-3"><h4>Monday</h4><div id="monday" class="day-col"></div></div>
      <div class="col-md-3"><h4>Tuesday</h4><div id="tuesday" class="day-col"></div></div>
      <div class="col-md-3"><h4>Wednesday</h4><div id="wednesday" class="day-col"></div></div>
      <div class="col-md-3"><h4>Thursday</h4><div id="thursday" class="day-col"></div></div>
      <div class="col-md-3"><h4>Friday</h4><div id="friday" class="day-col"></div></div>
      <div class="col-md-3"><h4>Saturday</h4><div id="saturday" class="day-col"></div></div>

    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="event_modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <form id="data-form" class="needs-validation" novalidate>

          <div class="modal-header">
            <h5 class="modal-title">Event Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <div class="mb-2">
              <label class="form-label">Event Name</label>
              <input id="event_name" type="text" class="form-control" required />
            </div>

            <div class="mb-2">
              <label class="form-label">Day of Week</label>
              <select id="event_weekday" class="form-select" required>
                <option value="sunday">Sunday</option>
                <option value="monday">Monday</option>
                <option value="tuesday">Tuesday</option>
                <option value="wednesday">Wednesday</option>
                <option value="thursday">Thursday</option>
                <option value="friday">Friday</option>
                <option value="saturday">Saturday</option>
              </select>
            </div>

            <div class="mb-2">
              <label class="form-label">Time</label>
              <input id="event_time" type="time" class="form-control" required />
            </div>

            <div class="mb-2">
              <label class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="academic">Academic</option>
                <option value="meeting">Meeting</option>
                <option value="club">Club</option>
                <option value="athletic">Athletic</option>
              </select>
            </div>

            <div class="mb-2">
              <label class="form-label">Modality</label>
              <select id="event_modality" class="form-select" onchange="updateLocationOptions()">
                <option value="in-person">In Person</option>
                <option value="remote">Remote</option>
              </select>
            </div>

            <div id="location_group" class="mb-2">
              <label class="form-label">Location</label>
              <input id="event_location" type="text" class="form-control" />
            </div>

            <div id="remote_group" class="mb-2 d-none">
              <label class="form-label">Remote URL</label>
              <input id="event_remote_url" type="text" class="form-control" />
            </div>

            <div class="mb-2">
              <label class="form-label">Attendees</label>
              <input id="event_attendees" type="text" class="form-control" />
            </div>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="saveEvent()">Save Event</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-dark text-light text-center py-3 mt-auto">
    <p>Hosted on GitHub Pages • Extra Credit Calendar</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
